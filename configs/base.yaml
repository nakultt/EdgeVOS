# EdgeVOS Base Configuration — Hydra/OmegaConf
# Usage: python train/distill_mask.py --config-name base

project:
  name: edgevos
  version: "1.0"
  seed: 42

# ── Model components ────────────────────────────────────────────
model:
  backbone: repvit_m1          # Student backbone (timm)
  backbone_pretrained: true
  text_encoder: MobileCLIP2-S2 # For M4 re-grounding (open_clip)
  text_encoder_pretrained: dfndr2b
  dinov3_model: facebook/dinov3-vits16-pretrain-lvd1689m  # STGP feature extractor
  dinov3_patch_size: 16
  dinov3_feat_dim: 384
  stgp_proj_dim: 256           # 384 → 256 projection
  mask_head_dims: [384, 512, 256]  # MLP mask head layers
  mask_out_size: 256           # Output mask resolution

# ── STGP Graph ──────────────────────────────────────────────────
stgp:
  keyframe_interval: 5         # K — add graph node every K frames
  sim_threshold_trigger: 0.45  # Cosine sim below this → trigger M4
  sim_threshold_recover: 0.55  # Re-identification threshold
  drift_frames: 3              # Frames below threshold before M4
  regrounding_interval: 150    # Max frames before forced re-grounding
  topk_patches: 30             # Top-k patches (out of 196) for object region
  ghost_confirm_frames: 5      # Frames needed to confirm re-identification

# ── Training — Distillation (Month 1) ───────────────────────────
distill:
  epochs: 30
  batch_size: 32
  lr: 1e-4
  weight_decay: 0.01
  warmup_epochs: 3
  loss_soft_weight: 1.0        # MSE on SAM 3.1 soft logits
  loss_dice_weight: 0.5        # Dice loss on binary mask
  loss_boundary_weight: 0.2    # Boundary-weighted BCE
  teacher_model: sam3           # SAM 3.1 teacher
  target_iou: 0.90             # Stop when student reaches 90% of teacher IoU

# ── Training — STGP Projection (Month 3) ────────────────────────
stgp_train:
  epochs: 20
  batch_size: 64
  lr: 5e-4
  temperature: 0.07            # InfoNCE temperature
  negatives_per_positive: 15   # Negatives in contrastive batch

# ── Data ────────────────────────────────────────────────────────
data:
  davis_root: data/DAVIS
  coco_root: data/COCO
  sam3_targets_dir: data/sam3_targets
  img_size: 224
  num_workers: 8

# ── Eval ────────────────────────────────────────────────────────
eval:
  davis_split: val
  davis_resolution: 480p
  youtube_vos_root: data/YouTube-VOS
  benchmark_k_values: [1, 3, 5, 10, 20]  # Ablation: keyframe intervals

# ── Export ──────────────────────────────────────────────────────
export:
  trt_version: "10.x"          # Update to 11.0 when released Q2 2026
  int8_calibration_samples: 500
  target_fps: 15
  target_device: "jetson_orin_nano"  # JetPack 6.2, TRT 10.3

# ── W&B ─────────────────────────────────────────────────────────
wandb:
  project: edgevos
  entity: null                 # Set to your W&B username
  log_interval: 10
  log_images_every: 500        # Log mask predictions every N steps
