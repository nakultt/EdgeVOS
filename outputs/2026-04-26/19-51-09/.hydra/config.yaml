project:
  name: edgevos
  version: '1.0'
  seed: 42
model:
  backbone: repvit_m1
  backbone_pretrained: true
  text_encoder: MobileCLIP2-S2
  text_encoder_pretrained: dfndr2b
  dinov3_model: facebook/dinov3-small
  dinov3_patch_size: 16
  dinov3_feat_dim: 384
  stgp_proj_dim: 256
  mask_head_dims:
  - 384
  - 512
  - 256
  mask_out_size: 256
stgp:
  keyframe_interval: 5
  sim_threshold_trigger: 0.45
  sim_threshold_recover: 0.55
  drift_frames: 3
  regrounding_interval: 150
  topk_patches: 30
  ghost_confirm_frames: 5
distill:
  epochs: 2
  batch_size: 4
  lr: 0.0001
  weight_decay: 0.01
  warmup_epochs: 3
  loss_soft_weight: 1.0
  loss_dice_weight: 0.5
  loss_boundary_weight: 0.2
  teacher_model: sam3
  target_iou: 0.9
stgp_train:
  epochs: 20
  batch_size: 64
  lr: 0.0005
  temperature: 0.07
  negatives_per_positive: 15
data:
  davis_root: data/DAVIS
  coco_root: data/COCO
  sam3_targets_dir: data/sam3_targets
  img_size: 224
  num_workers: 2
eval:
  davis_split: val
  davis_resolution: 480p
  youtube_vos_root: data/YouTube-VOS
  benchmark_k_values:
  - 1
  - 3
  - 5
  - 10
  - 20
export:
  trt_version: 10.x
  int8_calibration_samples: 500
  target_fps: 15
  target_device: jetson_orin_nano
wandb:
  project: edgevos
  entity: null
  log_interval: 10
  log_images_every: 500
